[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecom-churn"
version = "0.1.0"
description = "Telecom Customer Churn Prediction — EDA, Modelling & Streamlit App"
authors = [{ name = "Satwik", email = "satwikboina@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ── Data ──────────────────────────────────────────
    "kaggle>=1.6.0",                  # Kaggle API
    "pandas>=2.2.0",                  # Data manipulation
    "numpy>=1.26.0",                  # Numerical computing
    "pyarrow>=15.0.0",                # Parquet support

    # ── Visualisation ─────────────────────────────────
    "matplotlib>=3.8.0",              # Base plotting
    "seaborn>=0.13.0",                # Statistical plots
    "plotly>=5.20.0",                 # Interactive plots

    # ── Machine Learning ──────────────────────────────
    "scikit-learn>=1.4.0",            # ML framework
    "imbalanced-learn>=0.12.0",       # SMOTE & resampling
    "xgboost>=2.0.0",                 # XGBoost
    "lightgbm>=4.3.0",                # LightGBM

    # ── Model Persistence ─────────────────────────────
    "joblib>=1.3.0",                  # Save/load models

    # ── App ───────────────────────────────────────────
    "streamlit>=1.32.0",              # Streamlit app
    "streamlit-option-menu>=0.3.12",  # Sidebar navigation

    # ── Config & Environment ──────────────────────────
    "python-dotenv>=1.0.0",           # Load .env file
    "pyyaml>=6.0.0",                  # YAML config
    "omegaconf>=2.3.0",               # Config management

    # ── Logging ───────────────────────────────────────
    "loguru>=0.7.0",                  # Clean logging

    # ── Utilities ─────────────────────────────────────
    "tqdm>=4.66.0",                   # Progress bars
    "rich>=13.7.0",                   # Rich terminal output
]

[project.optional-dependencies]
dev = [
    # ── Testing ───────────────────────────────────────
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",

    # ── Notebooks ─────────────────────────────────────
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0",

    # ── Code Quality ──────────────────────────────────
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",

    # ── Debugging ─────────────────────────────────────
    "ipdb>=0.13.0",
]

# ── Ruff Linter ───────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

# ── Mypy ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

# ── Hatch ─────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src"]
